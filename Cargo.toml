[package]
name = "soda-lyrics"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "soda-lyrics"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
